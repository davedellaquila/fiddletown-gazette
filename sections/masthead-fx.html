<!-- ============================================================
     MASTHEAD TREATMENT — the rotating effects (Dave's direction,
     Wed Nov 25, 2026, superseding the single fixed treatment).
     The doghouse is the CONSTANT: the beagle atop his doghouse,
     windows glowing warm in every edition. One EFFECT layers on
     top per edition, rotating — never the same effect twice in a
     row. The active effect is chosen by ONE class on the masthead:
       <header class="masthead fx-smoke">   (or fx-twinkle,
       fx-leaves, fx-snow)
     ROTATION FORMULA (both papers): let N = 3 × (days since
     Fri Nov 27, 2026) + (0 Morning · 1 Midday · 2 Evening).
     N mod 4 → 0 fx-smoke · 1 fx-twinkle · 2 fx-leaves · 3 fx-snow.
     Every edition build SETS the class from the formula — it is
     never carried forward unchanged. (First cycle: Fri Nov 27 =
     smoke / twinkle / leaves; Sat Nov 28 = snow / smoke / twinkle;
     Sun Nov 29 = leaves / snow / smoke; Mon Nov 30 = twinkle /
     leaves / snow; then the 4-day pattern repeats.)
     Install: splice this whole fragment as the first child of
     <header class="masthead"> AND set the edition's fx-* class on
     that header. Editions preserve the fragment verbatim; only the
     class changes. A season slot replaces the whole treatment for
     the slot's run; the treatment (and the rotation) returns when
     the slot retires. Removal = delete this block + the fx class.
     ============================================================ -->
<style id="mast-fx-style">
.masthead{position:relative}
.masthead .fx-vignette{position:absolute;bottom:8px;left:6px;z-index:2;overflow:visible;pointer-events:none}
@media (min-width:761px){ .masthead{ padding-left:150px; padding-right:150px; } }
@media (max-width:760px){ .masthead .fx-vignette{ transform:scale(.6); transform-origin:bottom left; } }
/* the constant warm glow */
.masthead .fx-win{animation:fxGlow 5.5s ease-in-out infinite alternate}
.masthead .fx-halo{animation:fxHalo 5.5s ease-in-out infinite alternate}
@keyframes fxGlow{from{opacity:.85}to{opacity:1}}
@keyframes fxHalo{from{opacity:.5}to{opacity:.95}}
/* effect layers — exactly one shows, chosen by the masthead's fx-* class */
.masthead .fx-layer{display:none}
.masthead.fx-smoke .fx-layer[data-fx="smoke"],
.masthead.fx-twinkle .fx-layer[data-fx="twinkle"],
.masthead.fx-leaves .fx-layer[data-fx="leaves"],
.masthead.fx-snow .fx-layer[data-fx="snow"]{display:block}
/* smoke */
.masthead .fx-puff{fill:#d9d3c5;opacity:0;transform-box:fill-box;transform-origin:center;animation-name:fxRise;animation-duration:7.5s;animation-timing-function:linear;animation-iteration-count:infinite}
.masthead .fx-puff.p2{animation-delay:-1.9s}
.masthead .fx-puff.p3{animation-delay:-3.8s}
.masthead .fx-puff.p4{animation-delay:-5.7s}
@keyframes fxRise{0%{transform:translate(0,0) scale(.45);opacity:0}16%{opacity:.5}55%{opacity:.36}100%{transform:translate(13px,-38px) scale(1.55);opacity:0}}
/* twinkle */
.masthead .fx-bulb{animation:fxTwinkle 2.4s ease-in-out infinite}
.masthead .fx-bulb.b2{animation-delay:-.8s}
.masthead .fx-bulb.b3{animation-delay:-1.6s}
@keyframes fxTwinkle{0%,100%{opacity:.32}50%{opacity:1}}
/* leaves */
.masthead .fx-leaf{position:absolute;top:-26px;z-index:1;pointer-events:none;opacity:0;animation-name:fxFall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fxFall{0%{transform:translate3d(0,-26px,0) rotate(0deg);opacity:0}8%{opacity:.92}25%{transform:translate3d(16px,42px,0) rotate(96deg)}50%{transform:translate3d(-12px,86px,0) rotate(184deg)}75%{transform:translate3d(14px,128px,0) rotate(268deg)}92%{opacity:.85}100%{transform:translate3d(-6px,168px,0) rotate(344deg);opacity:0}}
/* snow */
.masthead .fx-flake{position:absolute;top:-14px;z-index:1;pointer-events:none;border-radius:50%;background:#a9c6d8;box-shadow:0 0 3px rgba(120,155,180,.55);opacity:0;animation-name:fxSnowFall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fxSnowFall{0%{transform:translate3d(0,-14px,0);opacity:0}10%{opacity:.95}30%{transform:translate3d(10px,50px,0)}55%{transform:translate3d(-8px,100px,0)}80%{transform:translate3d(8px,145px,0);opacity:.9}100%{transform:translate3d(-4px,178px,0);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .masthead .fx-puff{animation:none;opacity:0}
  .masthead .fx-puff.p3{opacity:.32}
  .masthead .fx-bulb,.masthead .fx-win,.masthead .fx-halo{animation:none}
  .masthead .fx-layer[data-fx="leaves"],.masthead .fx-layer[data-fx="snow"]{display:none!important}
}
</style>
